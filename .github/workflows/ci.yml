# SPDX-License-Identifier: AGPL-3.0-only
# PR と main への push で「ビルドが通り、テストが通る」ことだけを確かめる最小限の CI。
# 整形・静的解析・配置のずれは CI で止めず、定期リファクタリングでまとめて直す（AGENTS.md 第 15 節）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # 署名の名義が決まるまでは未署名のインストーラーを作る。証明書が届いたら、
      # Secrets から installer/signing.ps1 の環境変数を渡すだけで署名される。
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.Bal.wixext/5.0.2
      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -BuildDir build -Config Release -OutDir out/installer
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vocroz-installer-unsigned
          path: |
            out/installer/VOCROZ-Setup-*.exe
            out/installer/vocroz-app-*.zip
            out/installer/vocroz-app-*.zip.sha256
          if-no-files-found: error

  linux:
    # audio-core / transport / common が OS に依存していないことの確認を兼ねる。
    name: Linux (Clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  rendezvous:
    name: Rendezvous server (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/rendezvous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/rendezvous/go.mod
      - name: Test
        run: go vet ./... && go test ./...

  release-tools:
    name: Release tools (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/release/go.mod
      - name: Test
        run: go vet ./... && go test ./...
