# SPDX-License-Identifier: AGPL-3.0-only
# PR と main への push で「ビルドが通り、テストが通る」ことだけを確かめる最小限の CI。
# 整形・静的解析・配置のずれは CI で止めず、定期リファクタリングでまとめて直す（AGENTS.md 第 15 節）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 各ジョブの timeout-minutes: apt やパッケージの取得先が応答しないと、ジョブは既定の上限の
# 6 時間まで待ち続ける。ふだんの所要時間（Windows は約 25 分、ほかは 10 分以内）に余裕を見た時間で打ち切る。
jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # remote-pa は画面（ui/dist）を実行ファイルに埋め込むので、configure の前に UI をビルドする
      # （docs/adr/0020-ipc-pipe-and-webui-bridge.md）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      # JUCE を使うターゲットも含めてビルドする（VOCROZ_WITH_JUCE は Windows では既定で ON）。
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DVOCROZ_WITH_JUCE=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # 署名の名義が決まるまでは未署名のインストーラーを作る。証明書が届いたら、
      # Secrets から installer/signing.ps1 の環境変数を渡すだけで署名される。
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -BuildDir build -Config Release -OutDir out/installer
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vocroz-installer-unsigned
          path: |
            out/installer/VOCROZ-Setup-*.exe
            out/installer/vocroz-app-*.zip
            out/installer/vocroz-app-*.zip.sha256
          if-no-files-found: error

  linux:
    # audio-core / transport / common が OS に依存していないことの確認を兼ねる。
    name: Linux (Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # JUCE は GUI のライブラリ（GTK、WebKitGTK）を要求するので、Linux では外す。
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DVOCROZ_WITH_JUCE=OFF
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  realtime-sanitizer:
    # オーディオスレッドで実行する関数（VOCROZ_NONBLOCKING を付けたもの）の中で、ヒープ確保、ロック、
    # システムコールなど実行時間に上限がない操作をしていないかを、テストの実行中に検査する（AGENTS.md 第 9 節）。
    # RealtimeSanitizer は Clang 20 以降にしかないので、LLVM の apt リポジトリから入れる。
    name: Linux (RealtimeSanitizer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Clang 20
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y libclang-rt-20-dev
      # 検査の対象は audio-core のテストだけなので、そのターゲットだけをビルドする。
      # -Wno-function-effects: [[clang::nonblocking]] のコンパイル時の解析は、標準ライブラリの関数を
      # 呼ぶたびに警告を出す。違反の判定は実行時の検査で行うので、ログが読めるよう警告を外す。
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
          "-DCMAKE_CXX_FLAGS=-fsanitize=realtime -Wno-function-effects"
          -DVOCROZ_WITH_JUCE=OFF
      - name: Build
        run: cmake --build build -j --target audio_core_tests
      - name: Test
        run: ctest --test-dir build/modules/audio-core --output-on-failure

  rendezvous:
    name: Rendezvous server (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra/rendezvous
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: infra/rendezvous/go.mod
      - name: Test
        run: go vet ./... && go test ./...

  nat-simulation:
    # ネットワーク名前空間で NAT の種類（フルコーン、ポート制限、対称型）を模し、ランデブーサーバー越しの
    # ホールパンチの成否と、不成立のときの原因の区別を確かめる（docs/adr/0025-integration-test-harness.md）。
    # 名前空間と iptables に root 権限が要るので、ほかのジョブと分けて sudo で動かす。
    name: NAT simulation (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: infra/rendezvous/go.mod
      # sudo の環境では PATH が変わるので、setup-go が入れた go の場所を引き継ぐ。
      - name: Run NAT matrix
        run: sudo env "PATH=$PATH" tests/nat/run-nat-matrix.sh "$RUNNER_TEMP/nat"

  release-tools:
    name: Release tools (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/release/go.mod
      - name: Test
        run: go vet ./... && go test ./...

  ui:
    # 親機と子機の画面。jsdom とフェイクエンジンでテストするので、Windows も WebView2 も要らない。
    name: UI (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        # 型検査を含む（npm run build は tsc --noEmit のあとに vite build を実行する）。
        run: npm run build
